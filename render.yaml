services:
  # EduNexus AI Web — Static Frontend
  - type: web
    name: edunexus-ai-web
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      # SPA rewrite rule: reroute all unknown paths to index.html for client-side routing
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://edunexus-ai-api-z0v1.onrender.com
      - key: VITE_SUPABASE_URL
        value: https://blgqapkuizpyaqgyqftt.supabase.co
      - key: VITE_SUPABASE_ANON_KEY
        value: sb_publishable_3VC4FKHjx4ApAGFwaoQXSQ_crGEEkMw
      - key: VITE_ENABLE_DEMO_LOGIN
        value: "false"

  # EduNexus AI API — FastAPI Backend Service
  - type: web
    name: edunexus-ai-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: SUPABASE_URL
        value: https://blgqapkuizpyaqgyqftt.supabase.co
      - key: SUPABASE_JWT_ISSUER
        value: https://blgqapkuizpyaqgyqftt.supabase.co/auth/v1
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://edunexus-ai-web.onrender.com,http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://localhost:4173
